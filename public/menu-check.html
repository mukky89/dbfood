<!doctype html><html lang="sk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overenie menu – administrácia</title>
<style>body{font:16px/1.5 system-ui;background:#f5f0e5;color:#233c31;margin:0}main{max-width:1050px;margin:30px auto;padding:24px;background:#fffdf7;border-radius:16px}h1{font-size:26px}.notice{padding:14px;background:#e8efe6;border-radius:8px}form{display:flex;flex-wrap:wrap;gap:15px;margin:24px 0}label{display:flex;flex-direction:column;gap:5px}input,select,button{font:inherit;padding:9px;border:1px solid #bfc7b9;border-radius:6px}button{background:#284c3c;color:white;align-self:end;cursor:pointer}table{border-collapse:collapse;width:100%;margin:16px 0}th,td{text-align:left;vertical-align:top;padding:10px;border-bottom:1px solid #ddd}small{display:block;color:#59675f}#status{font-weight:600}caption{text-align:left;font-size:21px;font-weight:700;padding:10px 0}</style>
<main><h1>Overenie automatického menu a alergénov</h1>
<p class="notice">Izolovaný administrátorský náhľad na produkcii. Nemení aktívnu jedáleň, objednávky ani dátum servera. Zobrazuje iba menu skutočne zverejnené pre vybraný deň.</p>
<form id="check-form"><label>Heslo administrátora<input id="password" type="password" autocomplete="current-password" required></label><label>Jedáleň<select id="restaurant"><option value="lupo">Jedáleň LUPO</option><option value="fantozzi">Fantozzi</option><option value="nevadzka">Jedáleň Nevädzka</option></select></label><label>Dátum<input id="date" type="date" required></label><button id="check">Overiť menu</button></form>
<p id="status" role="status"></p><div id="result"></div><small>Možné alergény sú odhady podľa receptúry, nie potvrdené zloženie jedálne.</small></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('date').value=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Bratislava',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
$('check-form').addEventListener('submit',async event=>{
  event.preventDefault();$('check').disabled=true;$('result').innerHTML='';$('status').textContent='Načítavam automatický zdroj a overujem alergény…';
  try {
    const response=await fetch('/api/admin/menu-check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({adminPass:$('password').value,restaurantId:$('restaurant').value,date:$('date').value})});
    const data=await response.json();if(!data.ok)throw Error(data.error||'Nesprávne heslo alebo nedostupná kontrola.');
    const m=data.menu,review=m.allergenReview;
    if(!data.available){$('status').textContent='Menu pre '+m.date+' ešte nie je zverejnené. Dostupné dátumy: '+data.availableDates.join(', ');return;}
    $('status').textContent=data.reviewComplete?'Automatická kontrola dokončená: '+review.processed+' položiek. Neurčené: '+review.unresolved+'.':'Menu sa načítalo, automatická kontrola alergénov sa nedokončila.';
    $('result').innerHTML='<table><caption>'+esc(m.restaurant.name)+' · '+esc(m.date)+'</caption><thead><tr><th>Jedlo</th><th>Údaje jedálne</th><th>Možné ďalšie alergény</th></tr></thead><tbody>'+m.sekcie.flatMap(s=>s.polozky.map(p=>'<tr><td>'+esc(p.nazov)+'<small>'+esc(s.nazov)+'</small></td><td>'+esc(p.hmotnost||'Neuvedené')+'</td><td>'+esc(p.aiAllergens?.join(', ')||(p.aiAllergens?'Treba overiť v jedálni':'Bez ďalšieho odhadu'))+'<small>'+esc(p.aiAllergenBasis?.join('; ')||'')+'</small></td></tr>')).join('')+'</tbody></table>';
  }catch(error){$('status').textContent=error.message;}finally{$('check').disabled=false;}
});
</script></html>
